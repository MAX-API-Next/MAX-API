name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - alpha
      - nightly

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Build embedded frontend
        working-directory: web
        env:
          CI: ""
          DISABLE_ESLINT_PLUGIN: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: |
          bun install --frozen-lockfile
          cd default
          bun run build

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: JSON wrapper policy
        run: go run ./tools/jsonwrapcheck

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: web/default
        run: bun run typecheck

      - name: Build
        working-directory: web/default
        env:
          CI: ""
          DISABLE_ESLINT_PLUGIN: "true"
          NODE_OPTIONS: "--max-old-space-size=4096"
          VITE_REACT_APP_VERSION: ${{ github.sha }}
        run: bun run build
