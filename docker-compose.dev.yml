# Frontend Development - Backend built from local source
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. cd web && bun install && bun run dev
#   3. Open http://localhost:3001 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build max-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v

services:
  max-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: max-api-dev:local
    container_name: max-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=maxapi:LZKwJ4ncFk2dN7t2@tcp(172.0.0.1:3306)/maxapi
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
    depends_on:
      redis:
        condition: service_started
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: max-api-dev-redis
    restart: unless-stopped
    networks:
      - dev-network

volumes:
  dev_data:
  dev_pg_data:

networks:
  dev-network:
    driver: bridge
